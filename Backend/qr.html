<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        img {
            margin-top: 20px;
            border: 2px solid #000;
            padding: 10px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Payment Successful!</h1>
    <p>Scan the QR Code below for your payment details:</p>
    <img id="qrCode" alt="QR Code" />
    <script>
        const paymentId = prompt("Enter your Payment ID:");
        if (paymentId) {
            fetch(`/get-qr-code/${paymentId}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const qrCodeImage = document.getElementById('qrCode');
                        qrCodeImage.src = data.qrCode; // Set QR code image source
                    } else {
                        alert(data.message);
                    }
                })
                .catch(err => {
                    console.error("Error fetching QR code:", err);
                });
        } else {
            alert("No Payment ID provided!");
        }
    </script>
</body>
</html>
